name: api

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - "Directory.*.props"
      - "global.json"
      - "Quizly.slnx"
      - ".github/workflows/api.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Quizly.slnx

      - name: Build
        run: dotnet build Quizly.slnx -c Release --no-restore

      # Integration tests start PostgreSQL 18 with Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test --solution Quizly.slnx -c Release --no-build

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
