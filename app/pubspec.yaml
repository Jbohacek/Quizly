name: quizly
description: "Quizly, flashcards in Czech"
publish_to: 'none'

# versionName+versionCode of the APK. Bump both for every release.
version: 1.0.0-beta.3+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2
  fl_chart: ^1.3.0
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
